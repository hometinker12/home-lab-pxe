name: Feature request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the product behave if this is implemented?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Admin UI
        - Machine inventory / discovery
        - PXE / iPXE boot policy
        - Image library / deploy
        - cloud-init / Cloudbase-Init
        - Windows Server deploy
        - Encrypted local accounts
        - Authentication / RBAC
        - Docker / networking
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability report.
          required: true
