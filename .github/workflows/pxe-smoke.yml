# Tests: pytest + container PXE smoke on **develop**; same container PXE smoke on **release**.
# Container jobs **build the image locally and never docker push**.
# - **pytest**: ruff + unit tests on ubuntu.
# - **pxe-smoke-linux**: docker build (no push), Trivy High/Critical, run container, scripts/pxe_smoke.py
#   covering /health, /boot.ipxe, /ipxe pending vs deploy vs deployed vs staged, cloud-init, phone-home.

name: Pytest + PXE smoke

on:
  push:
    branches:
      - develop
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (ubuntu)
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Pytest
        run: python -m pytest

  pxe-smoke-linux:
    name: PXE and Docker image smoke (ubuntu + Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate test secrets
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, secrets
          enc = base64.urlsafe_b64encode(os.urandom(32)).decode()
          secret = secrets.token_urlsafe(32)
          pathlib.Path("ci.env").write_text(
              "\n".join(
                  [
                      f"SECRET_KEY={secret}",
                      f"ENCRYPTION_KEY={enc}",
                      "ADMIN_USER=admin",
                      "ADMIN_PASSWORD=smokepass",
                      "PXE_PUBLIC_URL=http://127.0.0.1:8080",
                      "PXE_HTTP_PORT=8080",
                      "PXE_HTTPS_PORT=8443",
                      "PXE_ENABLE_DHCP=1",
                      "PXE_DHCP_OPTIONAL=1",
                      "PXE_BIND_INTERFACE=eth0",
                      "PXE_DHCP_MODE=proxy",
                      "PXE_SMB_USER=pxemedia",
                      f"PXE_SMB_PASSWORD={secrets.token_urlsafe(24)}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build image (no push)
        run: |
          set -euo pipefail
          IMAGE_TAG="home-lab-pxe:ci-${GITHUB_SHA}"
          docker build . --file Dockerfile --build-arg VERSION="$(tr -d '\r\n' < VERSION)" --tag "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "CI smoke does not docker push."

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: home-lab-pxe:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Run container and PXE HTTP smoke
        run: |
          set -euo pipefail
          IMAGE_TAG="home-lab-pxe:ci-${GITHUB_SHA}"
          # Local image only. This workflow must never docker login or docker push.
          # Match docker-publish hardened smoke: read-only rootfs + writable tmpfs
          # for data/images/ssl/run/samba. Do not tmpfs TFTP — baked iPXE/wimboot live there.
          docker run -d --name pxe-smoke \
            --env-file ci.env \
            --read-only \
            --cap-drop ALL \
            --cap-add NET_ADMIN \
            --cap-add NET_RAW \
            --cap-add NET_BIND_SERVICE \
            --cap-add SETUID \
            --cap-add SETGID \
            --cap-add CHOWN \
            --cap-add FOWNER \
            --cap-add DAC_OVERRIDE \
            --cap-add DAC_READ_SEARCH \
            --cap-add SETFCAP \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=64M,mode=1777 \
            --tmpfs /run:size=32M,mode=0755 \
            --tmpfs /var/lib/pxe/data:size=64M,uid=10001,gid=10001,mode=1777 \
            --tmpfs /var/lib/pxe/images:size=16M,uid=10001,gid=10001,mode=1755 \
            --tmpfs /var/lib/pxe/ssl:size=1M,uid=10001,gid=10001,mode=1777 \
            --tmpfs /var/lib/samba:size=16M,mode=0755 \
            --tmpfs /var/cache/samba:size=16M,mode=0755 \
            --tmpfs /var/log/samba:size=8M,mode=1777 \
            --tmpfs /var/log/ganesha:size=8M,mode=1777 \
            --tmpfs /var/lib/nfs:size=8M,mode=1777 \
            --tmpfs /var/lib/misc:size=1M,mode=0755 \
            -p 8080:8080 \
            -p 8443:8443 \
            "$IMAGE_TAG"
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "container failed to become healthy"
            docker logs pxe-smoke || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/health
          https_ready=0
          for i in $(seq 1 30); do
            if curl -kfsS https://127.0.0.1:8443/health >/dev/null; then
              https_ready=1
              break
            fi
            sleep 1
          done
          if [ "$https_ready" != "1" ]; then
            echo "HTTPS failed to become healthy"
            docker logs pxe-smoke || true
            exit 1
          fi
          curl -kfsS https://127.0.0.1:8443/health
          docker exec pxe-smoke test -f /var/lib/pxe/ssl/tls.crt
          docker exec pxe-smoke test -f /var/lib/pxe/ssl/tls.key
          docker exec pxe-smoke bash -lc 'command -v 7z && 7z i >/dev/null'
          docker exec pxe-smoke pgrep -f src.extract_worker >/dev/null
          docker exec pxe-smoke testparm -s >/dev/null
          docker exec pxe-smoke pgrep -f ganesha.nfsd >/dev/null
          SMB_PASS=$(awk -F= '/^PXE_SMB_PASSWORD=/{print $2}' ci.env)
          python3 scripts/pxe_smoke.py --base-url http://127.0.0.1:8080 --user admin --password smokepass --smb-password "$SMB_PASS" --container pxe-smoke
          docker exec pxe-smoke python -c "from pathlib import Path; p=Path('/var/lib/pxe/tftp/wimboot'); data=p.read_bytes(); assert data.strip()!=b'ipxe-stub' and p.stat().st_size>1024"
          smb_ok=0
          for i in $(seq 1 15); do
            if docker exec pxe-smoke smbclient //127.0.0.1/pxe-media -U "pxemedia%${SMB_PASS}" -c 'ls' >/dev/null; then
              smb_ok=1
              break
            fi
            sleep 1
          done
          if [ "$smb_ok" != "1" ]; then
            echo "authenticated SMB list failed"
            docker logs pxe-smoke || true
            exit 1
          fi
          if docker exec pxe-smoke smbclient //127.0.0.1/pxe-media -U "pxemedia%${SMB_PASS}" -c 'put /etc/hosts hosts' >/dev/null 2>&1; then
            echo "SMB write unexpectedly succeeded"
            exit 1
          fi
          if docker exec pxe-smoke smbclient //127.0.0.1/pxe-media -N -c 'ls' >/dev/null 2>&1; then
            echo "anonymous SMB unexpectedly succeeded"
            exit 1
          fi
          echo "PXE HTTP smoke passed (image was not pushed)."
      - name: Container logs (always)
        if: always()
        run: docker logs pxe-smoke || true
      - name: Remove smoke container (never push)
        if: always()
        run: |
          docker rm -f pxe-smoke || true
          echo "No docker push was performed."

  develop-commit-gate:
    name: develop commit smoke gate
    if: github.ref == 'refs/heads/develop'
    needs:
      - pytest
      - pxe-smoke-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm pytest + PXE container smoke (no image push)
        run: |
          echo "develop smoke gate passed"
          echo "pytest and local docker PXE smoke are green"
          echo "no registry publish"
