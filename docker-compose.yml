services:
  pxe:
    image: hometinker12/home-lab-pxe:latest
    pull_policy: always
    # Bridge publishes HTTP/HTTPS plus DHCP/TFTP UDP. dnsmasq uses tftp-single-port so
    # TFTP file transfer stays on UDP 69 through Docker NAT. NFS casper pins NFS 2049
    # and mountd 20048 so Ubuntu netboot=nfs works through NAT without host port 111
    # (rpcbind). SMB still needs Linux host networking. For Linux LAN broadcasts, set
    # network_mode: host in docker-compose.override.yml (ports are ignored).
    ports:
      - "8080:8080"
      - "8443:8443"
      - "67:67/udp"
      - "69:69/udp"
      - "4011:4011/udp"
      - "2049:2049/tcp"
      - "2049:2049/udp"
      - "20048:20048/tcp"
      - "20048:20048/udp"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      PXE_DATABASE_URL: sqlite:////var/lib/pxe/data/pxe.db
      PXE_TFTP_ROOT: /var/lib/pxe/tftp
      PXE_IMAGE_ROOT: /var/lib/pxe/images
      PXE_DATA_DIR: /var/lib/pxe/data
      PXE_SSL_DIR: /var/lib/pxe/ssl
      PXE_HTTP_PORT: "8080"
      PXE_HTTPS_PORT: "8443"
      PXE_DHCP_OPTIONAL: "1"
    volumes:
      - pxe-data:/var/lib/pxe/data
      - pxe-images:/var/lib/pxe/images
      - pxe-tftp:/var/lib/pxe/tftp
      - pxe-ssl:/var/lib/pxe/ssl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pxe-data:
  pxe-images:
  pxe-tftp:
  pxe-ssl:
