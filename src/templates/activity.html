{% extends "base.html" %}
{% block title %}Activity — home-lab-pxe{% endblock %}
{% block body %}
<h1>Activity</h1>
<table>
  <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead>
  <tbody>
    {% for e in entries %}
    <tr>
      <td>{{ e.at }}</td>
      <td>{{ e.actor }}</td>
      <td>{{ e.action }}</td>
      <td>{{ e.detail }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4">No events.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
