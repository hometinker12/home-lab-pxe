{# Cloud-init node editor dialog.
   Context: cc_view ({doc, extra_yaml}), cc_schema (node list). #}
<dialog class="modal cc-editor-dialog" id="cc-editor-dialog" aria-labelledby="cc-editor-title">
  <h2 id="cc-editor-title">Cloud-init editor</h2>
  <p class="meta">Apply copies these fields into the user-data box. Save on the page stores that file.</p>
  <p class="alert alert-error" data-cc-error hidden role="alert"></p>
  <div class="cc-editor" data-cc-editor>
    <script type="application/json" class="cc-schema">{{ cc_schema|tojson }}</script>
    <script type="application/json" class="cc-doc">{{ cc_view.doc|tojson }}</script>
    <div class="cc-nav" role="tablist" aria-label="Cloud-init modules"></div>
    <div class="cc-detail"></div>
    <details class="cc-advanced">
      <summary>Advanced YAML</summary>
      <p class="meta">Keys this form does not model. This is not the autoinstall installer block.</p>
      <textarea data-cc-extra rows="8" class="seed-editor">{{ cc_view.extra_yaml }}</textarea>
    </details>
  </div>
  <div class="modal-actions">
    <button type="button" class="btn-secondary" data-close-dialog>Cancel</button>
    <button type="button" data-cc-apply>Apply</button>
  </div>
</dialog>
