<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}home-lab-pxe{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-bar">
      <a class="brand" href="/machines">
        <img class="brand-mark" src="/static/favicon.png" alt="" width="28" height="28">
        <span class="brand-name">home-lab-pxe</span>
      </a>
      {% if user %}
      <nav>
        <a href="/machines">Machines</a>
        <a href="/images">Images</a>
        <a href="/activity">Activity</a>
        <a href="/settings">Settings</a>
      </nav>
      <form class="logout" method="post" action="/logout">
        <span class="who">{{ user }}</span>
        <button type="submit">Log out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main class="wrap">
    {% block body %}{% endblock %}
  </main>
  <footer class="wrap">v{{ version }}</footer>
</body>
</html>
