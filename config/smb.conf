[global]
   workgroup = WORKGROUP
   server role = standalone server
   map to guest = never
   smb encrypt = desired
   min protocol = SMB2
   smb ports = 445
   disable netbios = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 50
   logging = syslog@0 file

[pxe-media]
   path = /var/lib/pxe/images/smb
   comment = home-lab-pxe Windows Setup media
   browseable = no
   read only = yes
   guest ok = no
   valid users = pxemedia
   force user = app
   force group = app
   follow symlinks = no
   wide links = no
   veto files = /*.tmp/
