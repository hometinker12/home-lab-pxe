NFS_CORE_PARAM {
    Protocols = 3;
    NFS_Port = 2049;
    MNT_Port = 20048;
    NLM_Port = 0;
    Rquota_Port = 0;
    Enable_NLM = false;
    Enable_RQUOTA = false;
    Allow_Set_Io_Flusher_Fail = true;
}

EXPORT_DEFAULTS {
    Access_Type = RO;
    Protocols = 3;
    Transports = TCP;
    SecType = none, sys;
    Squash = All;
    Anonymous_Uid = 65534;
    Anonymous_Gid = 65534;
}

# One EXPORT Path per extracted generation (see pxe-generations.conf).
# Subdirectory MNT of a parent Path is EACCES; casper mounts the generation Path.
%include /var/run/ganesha/pxe-generations.conf
