NFS_CORE_PARAM {
    Protocols = 3;
    NFS_Port = 2049;
    MNT_Port = 20048;
    NLM_Port = 0;
    Rquota_Port = 0;
    Enable_NLM = false;
    Enable_RQUOTA = false;
    Allow_Set_Io_Flusher_Fail = true;
}

NFSV4 {
    Grace_Period = 0;
}

EXPORT_DEFAULTS {
    Access_Type = RO;
    Protocols = 3;
    Transports = TCP,UDP;
    SecType = none, sys;
    Squash = None;
}

EXPORT {
    Export_Id = 1;
    Path = /var/lib/pxe/images/nfs;
    Pseudo = /var/lib/pxe/images/nfs;
    # Casper mounts this Path. nfs/{id}/{rev} is not a separate export (subdir
    # MNT is EACCES; nested Path MNT is EPERM on Linux). casper/ is hardlinked here.
    Access_Type = RO;
    Protocols = 3;
    Transports = TCP,UDP;
    SecType = none, sys;
    Squash = None;
    Disable_ACL = true;
    CLIENT {
        Clients = *;
        Access_Type = RO;
        SecType = none, sys;
        Squash = None;
    }
    FSAL {
        Name = VFS;
    }
}
